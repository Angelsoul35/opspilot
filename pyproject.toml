[project]
name = "opspilot"
version = "1.0.0"
description = "An incident assistant over runbooks: TF-IDF retrieval matches an incident to a vetted runbook, an LLM writes a triage summary grounded in it (with an offline fallback), and every system-changing step is gated behind explicit human approval and only ever dry-run."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Angelo David Padilla Romero" }]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "scikit-learn>=1.5",
  "numpy>=2.1",
  "httpx>=0.28",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8"]

[project.scripts]
opspilot = "opspilot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["opspilot*"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]
